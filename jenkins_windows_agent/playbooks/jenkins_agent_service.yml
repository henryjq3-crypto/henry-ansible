---
- name: Install Jenkins Agent as a Windows Service and start it
  hosts: all
  gather_facts: no

  vars:
    jenkins_jnlp_url: 'http://34.235.136.143:8080/computer/window/jenkins-agent.jnlp'
    jenkins_jar_path: 'C:\JenkinsAgent\agent.jar'
    jenkins_secret: 'b84f33f7c2e9ccfbfeb4c222d13fcc2311e018da6e6e4e477c3da4d13f7ba264'
    service_name: 'JenkinsAgent'
    start_script: 'C:\JenkinsAgent\start-agent.ps1'
    log_file: 'C:\JenkinsAgent\agent-service.log'
    # Where to store agent files
    jenkins_agent_dir: 'C:\JenkinsAgent'

    # Your Jenkins controller URL (no trailing slash is fine either way)
    jenkins_url: 'http://34.235.136.143:8080'

    # The agent name you created in Jenkins
    jenkins_agent_name: 'windows'

    # The agent secret from Jenkins (Manage Jenkins -> Nodes -> your node -> secret)
    jenkins_agent_secret: 'b84f33f7c2e9ccfbfeb4c222d13fcc2311e018da6e6e4e477c3da4d13f7ba264'

    # Where to download the agent.jar from Jenkins
    jenkins_agent_jar_url: '{{ jenkins_url }}/jnlpJars/agent.jar'
    jenkins_agent_jar_path: '{{ jenkins_agent_dir }}\agent.jar'

    # Service details
    jenkins_service_name: 'JenkinsAgent'
    jenkins_service_display: 'Jenkins Agent Service'

    # The service will run as LocalSystem (easy mode)
    # If you need a domain/service account later, tell me and I’ll adjust it.
    jenkins_java_path: 'C:\Program Files\Java\jdk-17\bin\java.exe'

    # Jenkins inbound agent command (JNLP)
    jenkins_agent_args: >-
      -jar "{{ jenkins_agent_jar_path }}"
      -jnlpUrl "{{ jenkins_url }}/computer/{{ jenkins_agent_name }}/jenkins-agent.jnlp"
      -secret "{{ jenkins_agent_secret }}"
      -workDir "{{ jenkins_agent_dir }}"

  tasks:
    - name: 1) Make folder for Jenkins Agent
      ansible.windows.win_file:
        path: "{{ jenkins_agent_dir }}"
        state: directory

    - name: 2) Download agent.jar from Jenkins
      ansible.windows.win_get_url:
        url: "{{ jenkins_agent_jar_url }}"
        dest: "{{ jenkins_agent_jar_path }}"
        force: yes

    - name: 3) Check if the service already exists
      ansible.windows.win_service_info:
        name: "{{ jenkins_service_name }}"
      register: svc_info

  #  - name: 4) Create the Jenkins Agent service (only if missing)
  #    ansible.windows.win_shell: >
  #      sc.exe create "{{ jenkins_service_name }}"
  #      binPath= "\"{{ jenkins_java_path }}\" {{ jenkins_agent_args }}"
  #     start= auto
  #     DisplayName= "{{ jenkins_service_display }}"
  #    when: not svc_info.exists
 #   - name: 4) Create Jenkins Agent service safely
  #    ansible.windows.win_service:
   #    name: JenkinsAgent
    #   display_name: Jenkins Agent Service
     #  path: >
      #  " C:\Program Files\Java\jdk-17\bin\java.exe"
      #  -jar "C:\JenkinsAgent\agent.jar"
     #   -jnlpUrl "http://34.235.136.143:8080/computer/window/jenkins-agent.jnlp"
     #   -secret "b84f33f7c2e9ccfbfeb4c222d13fcc2311e018da6e6e4e477c3da4d13f7ba264"
    #    -workDir "C:\JenkinsAgent"
    #   start_mode: auto
   #    state: started
    - name: 4) Write PowerShell wrapper to start agent (with logs)
      ansible.windows.win_copy:
       dest: "{{ start_script }}"
       content: |
        $ErrorActionPreference = "Stop"

        $java = "{{ jenkins_java_path }}"
        $jar  = "{{ jenkins_jar_path }}"
        $jnlp = "{{ jenkins_jnlp_url }}"
        $secret = "{{ jenkins_secret }}"
        $work = "{{ jenkins_agent_dir }}"
        $log  = "{{ log_file }}"

        "=== Starting Jenkins Agent Service: $(Get-Date) ===" | Out-File -FilePath $log -Append
        "Java: $java" | Out-File -FilePath $log -Append
        "Jar:  $jar"  | Out-File -FilePath $log -Append
        "JNLP: $jnlp" | Out-File -FilePath $log -Append
        "Work: $work" | Out-File -FilePath $log -Append

        & $java -jar $jar -jnlpUrl $jnlp -secret $secret -workDir $work *>> $log

    - name: 5) Stop existing service if present (ignore if missing)
      ansible.windows.win_service:
       name: "{{ service_name }}"
       state: stopped
      ignore_errors: yes

    - name: 6) Delete existing service (clean slate) (ignore if missing)
      ansible.windows.win_shell: |
       sc.exe delete "{{ service_name }}"
      ignore_errors: yes

    - name: 7) Create Jenkins Agent service that runs the wrapper script
      ansible.windows.win_service:
       name: "{{ service_name }}"
       display_name: "Jenkins Agent Service"
       path: >-
        C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        -NoProfile -ExecutionPolicy Bypass -File "{{ start_script }}"
       start_mode: auto
       state: started

    - name: 8) Read last 80 lines of service log (for troubleshooting)
      ansible.windows.win_shell: |
       if (Test-Path "{{ log_file }}") { Get-Content "{{ log_file }}" -Tail 80 } else { "No log file yet." }
      register: agent_log
      changed_when: false

    - name: Show log tail
      ansible.builtin.debug:
       var: agent_log.stdout_lines

    - name: 5) Ensure service is set to start automatically
      ansible.windows.win_service:
        name: "{{ jenkins_service_name }}"
        start_mode: auto

    - name: 6) Start the Jenkins Agent service
      ansible.windows.win_service:
        name: "{{ jenkins_service_name }}"
        state: started

    - name: 7) Show service status
      ansible.windows.win_service_info:
        name: "{{ jenkins_service_name }}"
      register: final_status

    - name: Print final service status
      ansible.builtin.debug:
        var: final_status
